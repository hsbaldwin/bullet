/* ───────────── 상태 ───────────── */
const S = {
  state: 'title', stateT: 0, stage: 1, score: 0, streak: 0, ammo: 3, shots: 0, time: 0, ts: 1, tsBase: 1,
  yaw: 0, pitch: 0, aimYaw: 0, aimPitch: 0, breath: 1, holding: false, winded: false, wind: 0,
  target: null, bullet: null, trail: [], rings: [], particles: [], marks: [], trees: [], flags: [],
  feedback: '', popup: null, flash: 0, shake: 0, history: [], lastRank: null,
};

function targetPos(t = S.time) {
  const T = S.target;
  return { x: T.x + T.amp * Math.sin(T.freq * t + T.phase), y: T.y, z: T.z };
}

function makeStage(n) {
  const z = Math.min(150, 30 + n * 12 + rand(0, 10));
  const R = Math.max(0.7, 1.4 - n * 0.05);
  const x = n === 1 ? rand(-1, 1) : rand(-1, 1) * Math.min(14, n * 2.5);
  const y = R + 0.4 + (n < 3 ? 0 : rand(0, Math.min(4, n * 0.5)));
  const amp = n >= 4 ? Math.min(4, (n - 3) * 0.8) : 0;
  S.target = { x, y, z, R, amp, freq: rand(0.5, 0.9), phase: rand(0, Math.PI * 2) };
  S.wind = n >= 2 ? (Math.random() < 0.5 ? -1 : 1) * rand(0.35, 1) * Math.min(8, 1 + n) : 0;
  S.ammo = 3; S.shots = 0; S.marks = []; S.feedback = '';
  S.trees = [];
  for (let i = 0; i < 26; i++) {
    const side = i % 2 ? 1 : -1, tz = rand(12, z + 70), tx = side * rand(9, 48);
    const lineX = x * (tz / z);
    if (Math.abs(tx - lineX) < 5) continue;
    S.trees.push({ x: tx, z: tz, h: rand(5, 10), w: rand(1.8, 3.2), shade: Math.random() });
  }
  S.flags = [];
  for (let d = 25; d < z; d += 25) S.flags.push({ x: -4.5, z: d, h: 3.4, label: d, phase: d * 0.3 });
  S.flags.push({ x: x + R + amp + 1.6, z, h: Math.max(3, y + R + 0.8), phase: 2.1, near: true });
}

/* ───────────── 소리 ───────────── */
let actx = null, muted = false, noiseBuf = null;
function audio() {
  if (!actx) {
    try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; }
    const len = actx.sampleRate * 1.5; noiseBuf = actx.createBuffer(1, len, actx.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  }
  if (actx.state === 'suspended') actx.resume();
  return actx;
}
function noise(dur, type, freq, gain, q = 1, freqEnd) {
  const a = audio(); if (!a || muted) return; const t = a.currentTime;
  const src = a.createBufferSource(); src.buffer = noiseBuf;
  const f = a.createBiquadFilter(); f.type = type; f.frequency.setValueAtTime(freq, t); f.Q.value = q;
  if (freqEnd) f.frequency.exponentialRampToValueAtTime(freqEnd, t + dur);
  const g = a.createGain(); g.gain.setValueAtTime(gain, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  src.connect(f).connect(g).connect(a.destination); src.start(t); src.stop(t + dur);
}
function tone(freq, dur, type, gain, freqEnd, delay = 0) {
  const a = audio(); if (!a || muted) return; const t = a.currentTime + delay;
  const o = a.createOscillator(); o.type = type; o.frequency.setValueAtTime(freq, t);
  if (freqEnd) o.frequency.exponentialRampToValueAtTime(freqEnd, t + dur);
  const g = a.createGain(); g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(gain, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t + dur + 0.02);
}
const sfx = {
  shot() { noise(0.6, 'lowpass', 3500, 1, 0.7, 250); tone(120, 0.4, 'sine', 0.9, 30); noise(0.08, 'highpass', 2600, 0.6); },
  whoosh() { noise(0.9, 'bandpass', 600, 0.25, 2, 2400); },
  hit() { tone(320, 0.25, 'triangle', 0.5, 70); noise(0.06, 'highpass', 1800, 0.6); },
  bull() { tone(880, 0.6, 'triangle', 0.25, null, 0.08); tone(1320, 0.8, 'triangle', 0.2, null, 0.18); },
  dirt() { noise(0.3, 'lowpass', 900, 0.35, 0.8, 120); },
  stage() { [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.25, 'square', 0.07, null, i * 0.08)); },
  over() { [392, 330, 262].forEach((f, i) => tone(f, 0.35, 'sawtooth', 0.06, null, i * 0.16)); },
};

/* ───────────── 조준 흔들림 & 숨 ───────────── */
function swayAmp() { return S.winded ? 0.30 * DEG : (S.holding && S.breath > 0 ? 0.015 * DEG : 0.10 * DEG); }
let swayA = 0.1 * DEG;
function sway(t) {
  return {
    yaw: swayA * (Math.sin(t * 1.1) * 0.7 + Math.sin(t * 2.3 + 1) * 0.3),
    pitch: swayA * (Math.sin(t * 0.9 + 2) * 0.6 + Math.sin(t * 1.7) * 0.4) * 0.8,
  };
}
function aimDir() {
  const sw = sway(performance.now() / 1000);
  return { yaw: S.yaw + sw.yaw, pitch: S.pitch + sw.pitch };
}

/* ───────────── 사격 & 물리 ───────────── */
function dirFrom(yaw, pitch) { return { x: Math.sin(yaw) * Math.cos(pitch), y: Math.sin(pitch), z: Math.cos(yaw) * Math.cos(pitch) }; }
function step(b, dt) { b.vx += WIND_LAT * S.wind * dt; b.vy -= G * dt; b.x += b.vx * dt; b.y += b.vy * dt; b.z += b.vz * dt; }
function predict(yaw, pitch) {
  const d = dirFrom(yaw, pitch), T = S.target;
  const b = { x: 0, y: EYE, z: 0, vx: d.x * V0, vy: d.y * V0, vz: d.z * V0 }; let t = 0;
  while (t < 3) {
    const pz = b.z, px = b.x, py = b.y; step(b, PHYS_DT); t += PHYS_DT;
    if (b.z >= T.z) { const f = (T.z - pz) / (b.z - pz); return { reach: true, x: px + (b.x - px) * f, y: py + (b.y - py) * f, t }; }
    if (b.y < 0) return { reach: false, t };
  }
  return { reach: false, t };
}

function fire() {
  if (S.state !== 'aim' || S.ammo <= 0) return;
  audio();
  const a = aimDir(), d = dirFrom(a.yaw, a.pitch);
  S.bullet = { x: 0, y: EYE, z: 0, vx: d.x * V0, vy: d.y * V0, vz: d.z * V0, t: 0, crossed: false, whoosh: false };
  const P = predict(a.yaw, a.pitch);
  let near = false;
  if (P.reach) { const tp = targetPos(S.time + P.t); near = Math.hypot(P.x - tp.x, P.y - tp.y) <= S.target.R + 1.0; }
  S.bullet.near = near;
  S.tsBase = clamp(P.t / (near ? 1.1 : 0.45), 0.05, 1); // 실제 화면에서 보이는 비행 시간: 명중권 1.1초, 그 외 0.45초
  S.trail = []; S.rings = []; S.nextRing = 4; S.physAcc = 0;
  S.ammo--; S.shots++; S.flash = 0.08; S.shake = 0.5; S.feedback = '';
  sfx.shot();
  setState('fired');
}

function physStep() {
  const b = S.bullet, T = S.target;
  const px = b.x, py = b.y, pz = b.z;
  step(b, PHYS_DT); b.t += PHYS_DT;
  if (!b.crossed && pz < T.z && b.z >= T.z) {
    const f = (T.z - pz) / (b.z - pz), hx = px + (b.x - px) * f, hy = py + (b.y - py) * f;
    const tp = targetPos(), dx = hx - tp.x, dy = hy - tp.y;
    b.crossed = true; b.dx = dx; b.dy = dy;
    if (Math.hypot(dx, dy) <= T.R) { onHit(hx, hy, dx, dy); return; }
  }
  S.trail.push({ x: b.x, y: b.y, z: b.z }); if (S.trail.length > 120) S.trail.shift();
  if (b.z >= S.nextRing) { S.rings.push({ x: b.x, y: b.y, z: b.z, age: 0 }); S.nextRing += 6; }
  if (b.y <= 0) { dust(b.x, 0, b.z); onMiss(); return; }
  if (b.z > T.z + 10 || b.t > 3) onMiss(); // 표적을 지나치면 바로 결과로
}

function dust(x, y, z) {
  for (let i = 0; i < 26; i++) S.particles.push({ x, y: y + 0.05, z, vx: rand(-2, 2), vy: rand(1, 5), vz: rand(-2, 2),
    life: rand(0.6, 1.4), max: 1.4, size: rand(0.05, 0.16), color: i % 3 ? '120,92,58' : '86,140,60' });
  sfx.dirt();
}

const offText = (dx, dy) => {
  const h = Math.abs(dx) < 0.05 ? '' : (dx > 0 ? L().right : L().left)(Math.abs(dx).toFixed(1));
  const v = Math.abs(dy) < 0.05 ? '' : (dy > 0 ? L().up : L().down)(Math.abs(dy).toFixed(1));
  return [h, v];
};

function onHit(hx, hy, dx, dy) {
  const T = S.target, b = S.bullet;
  b.stuck = true; b.dx = dx; b.dy = dy; b.x = hx; b.y = hy; b.z = T.z;
  S.marks.push({ dx, dy });
  const ring = Math.max(1, 10 - Math.floor(Math.hypot(dx, dy) / T.R * 10));
  const first = S.shots === 1;
  S.streak = first ? S.streak + 1 : 0;
  const pts = Math.round((ring * 10 + Math.round(T.z)) * (first ? 1.5 : 1)) + (first && S.streak > 1 ? (S.streak - 1) * 25 : 0);
  S.score += pts; S.history.push(ring);
  const label = ring === 10 ? L().bullseye : ring >= 8 ? L().great : ring >= 5 ? L().hit : L().close;
  S.popup = { title: label, sub: L().ringPts(ring, pts, first), gold: ring === 10, age: 0 };
  const [h, v] = offText(dx, dy); S.feedback = L().hitAt(h, v);
  const cols = ['244,241,234', '230,57,70', '29,111,209', '255,210,63', '150,110,70'];
  for (let i = 0; i < 40; i++) S.particles.push({ x: hx, y: hy, z: T.z - 0.05, vx: rand(-4, 4), vy: rand(-1, 5), vz: rand(-6, -1),
    life: rand(0.6, 1.5), max: 1.5, size: rand(0.03, 0.09), color: cols[i % cols.length] });
  sfx.hit(); if (ring === 10) sfx.bull();
  S.result = { hit: true };
  setState('result');
}

function onMiss() {
  const b = S.bullet, T = S.target;
  S.streak = 0;
  if (b.crossed) { const [h, v] = offText(b.dx, b.dy); S.feedback = L().missAt(h, v); }
  else S.feedback = L().short(Math.max(0, T.z - b.z).toFixed(0));
  S.result = { hit: false };
  setState('result');
}

/* ───────────── 진행 ───────────── */
function setState(s) { S.state = s; S.stateT = 0; }
const bannerEl = document.getElementById('banner'); let bannerT = 0;
function banner(t, p, d) { bannerEl.querySelector('h2').textContent = t; bannerEl.querySelector('p').textContent = p; bannerEl.style.opacity = 1; bannerT = d; }
function windLabel() {
  const w = S.wind; if (Math.abs(w) < 0.05) return L().windNone;
  return L().windTxt(w > 0 ? 1 : -1, Math.abs(w).toFixed(1));
}
function startStage() {
  makeStage(S.stage);
  setAim(0, 0); S.bullet = null; S.trail = []; S.rings = [];
  setState('aim');
  banner(`STAGE ${S.stage}`, L().introInfo(S.target.z.toFixed(0), windLabel()) + (S.target.amp ? ' · ' + L().moving : ''), 2.4);
  sfx.stage();
}
function startGame() {
  audio();
  S.stage = 1; S.score = 0; S.streak = 0; S.time = 0; S.particles = []; S.breath = 1; S.winded = false; S.history = []; S.lastRank = null;
  overlay.classList.add('hidden');
  startStage();
}
function afterResult() {
  if (S.result.hit) { S.stage++; startStage(); }
  else if (S.ammo > 0) { S.bullet = null; setState('aim'); }
  else gameOver();
}
function gameOver() {
  setState('gameover');
  sfx.over();
  const isBest = S.score > best;
  if (isBest) { best = S.score; store.set('bullet.fps.best', String(best)); }
  if (document.pointerLockElement) document.exitPointerLock();
  const run = { score: S.score, stage: S.stage, posted: false };
  showCard(`
    <h1>GAME OVER</h1>
    <p class="sub" style="margin-bottom:6px">${L().goSub}</p>
    <div class="big">${S.score.toLocaleString()}</div>
    <p class="sub" style="margin-bottom:0">${L().goStats(S.stage, best.toLocaleString(), isBest)}</p>
    <div class="sharecard" id="sharecard"></div>
    <div class="btns"><button id="share">${L().share}</button><button class="ghost" id="go2">${L().retry}</button></div>
    <p class="sharestatus" id="sharestatus"></p>
    <form class="submit" id="sub">
      <input id="nick" maxlength="16" placeholder="${L().nickPh}" autocomplete="nickname" required>
      <button id="send" type="submit">${L().submit}</button>
    </form>
    <p class="status" id="where"></p>
    <p class="status" id="status">${LB.on ? L().statusOnline : L().statusLocal}</p>
    <h3>${LB.on ? L().hWorld : L().hLocal}</h3>
    ${boardHtml()}
    <div class="btns"><button id="go">${L().retry}</button></div>`);
  const sharecard = card.querySelector('#sharecard'), sharestatus = card.querySelector('#sharestatus');
  sharecard.textContent = shareText();
  card.querySelector('#share').addEventListener('click', () => shareResult(sharestatus, sharecard));
  card.querySelector('#go2').addEventListener('click', () => startGame());
  const nick = card.querySelector('#nick'), where = card.querySelector('#where');
  nick.value = store.get('bullet.name') || '';
  const form = card.querySelector('#sub'), status = card.querySelector('#status'), send = card.querySelector('#send');
  if (S.score <= 0) { send.disabled = true; status.textContent = L().zero; }

  // 접속 위치(서버가 IP로 판단)와 이미 등록된 내 기록을 보여줍니다.
  const showMe = m => {
    if (!m) return;
    let t = L().whereFrom(flag(m.country), countryName(m.country));
    if (m.name) t += ' · ' + L().myRecord(m.name, Number(m.score).toLocaleString(), Number(m.rank).toLocaleString());
    where.textContent = t;
    if (m.name) { nick.value = m.name; store.set('bullet.name', m.name); }
  };
  if (LB.on) LB.me(playerToken()).then(showMe).catch(() => {});

  form.addEventListener('submit', async e => {
    e.preventDefault();
    if (run.posted) return;
    const name = nick.value.replace(/\s+/g, ' ').trim();
    if (!name) { status.className = 'status err'; status.textContent = L().needNick; return; }
    store.set('bullet.name', name);
    send.disabled = true; status.className = 'status'; status.textContent = L().sending;
    if (!LB.on) {
      const r = saveLocal(name, run.score, run.stage);
      run.posted = true;
      status.className = 'status ok';
      status.textContent = r.improved ? L().savedLocal : L().keptLocal(r.best.toLocaleString());
      loadBoard(name);
      return;
    }
    try {
      const r = await LB.submit(playerToken(), name, run.score, run.stage);
      run.posted = true;
      const rank = Number(r.out_rank).toLocaleString(), total = Number(r.out_total).toLocaleString();
      status.className = 'status ok';
      status.textContent = r.out_improved ? L().postedBest(rank, total) : L().postedKept(Number(r.out_best).toLocaleString(), rank);
      if (r.out_improved) { S.lastRank = rank; sharecard.textContent = shareText(); } // 이번 판이 최고 기록일 때만 순위를 공유
      showMe({ country: r.out_country, name: r.out_name, score: r.out_best, rank: r.out_rank });
      loadBoard(r.out_name);
    } catch (err) {
      send.disabled = false;
      status.className = 'status err';
      status.textContent = L().postFail + friendlyError(err);
    }
  });
  loadBoard(null);
}

/* ───────────── 결과 공유 ───────────── */
const ringEmoji = r => r >= 9 ? '🟡' : r >= 7 ? '🔴' : r >= 5 ? '🔵' : r >= 3 ? '⚫' : '⚪';
function shareText() {
  const cells = S.history.map(ringEmoji).concat('❌');
  const rows = [];
  for (let i = 0; i < cells.length; i += 10) rows.push(cells.slice(i, i + 10).join(''));
  const lines = [L().shareHead(S.stage, S.score.toLocaleString()), ...rows];
  if (S.lastRank) lines.push(L().shareRank(S.lastRank));
  lines.push(shareLink());
  return lines.join('\n');
}
function shareLink() {
  return (window.BULLET_CONFIG && window.BULLET_CONFIG.shareUrl) || 'https://hsbaldwin.github.io/bullet/';
}
async function shareResult(statusEl, previewEl) {
  const text = shareText();
  previewEl.textContent = text;
  const touch = matchMedia('(pointer:coarse)').matches;
  if (touch && navigator.share) {
    try { await navigator.share({ text }); return; } catch (e) { if (e && e.name === 'AbortError') return; }
  }
  try {
    await navigator.clipboard.writeText(text);
    statusEl.textContent = L().copied;
  } catch (e) {
    statusEl.textContent = L().copyManual;
    const r = document.createRange(); r.selectNodeContents(previewEl);
    const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r);
  }
}

/* ───────────── 랭킹 ───────────── */
// 랭킹은 플레이어당 한 줄입니다. 브라우저마다 비밀 토큰을 하나 만들어 "내 기록"의 주인을 확인하고,
// 서버는 토큰의 해시만 저장합니다. 국가는 서버가 접속 IP로 정합니다.
let TOKEN = null;
function playerToken() {
  if (TOKEN) return TOKEN;
  let t = store.get('bullet.token');
  if (!t || !/^[0-9a-f]{64}$/.test(t)) {
    const bytes = new Uint8Array(32);
    crypto.getRandomValues(bytes);
    t = Array.from(bytes, b => b.toString(16).padStart(2, '0')).join('');
    store.set('bullet.token', t);
  }
  return (TOKEN = t);
}
const LB = (() => {
  const cfg = window.BULLET_CONFIG || {};
  const url = String(cfg.supabaseUrl || '').replace(/\/+$/, '');
  const key = String(cfg.supabaseAnonKey || '');
  const on = !!(url && key);
  // 기존 anon key(JWT)는 Authorization에도 넣고, 새 publishable key(sb_publishable_…)는 apikey 헤더만 씁니다.
  const headers = () => Object.assign({ apikey: key, 'Content-Type': 'application/json' },
    key.startsWith('eyJ') ? { Authorization: 'Bearer ' + key } : {});
  async function rpc(fn, args) {
    const ctl = new AbortController(); const tm = setTimeout(() => ctl.abort(), 9000);
    try {
      const r = await fetch(`${url}/rest/v1/rpc/${fn}`, { method: 'POST', headers: headers(), body: JSON.stringify(args), signal: ctl.signal });
      const body = await r.json().catch(() => null);

function friendlyError(err) {
  const m = String(err && err.message || err);
  if (/abort/i.test(m)) return L().errTimeout;
  if (/name taken/i.test(m)) return L().errNameTaken;
  if (/too many players/i.test(m)) return L().errIpLimit;
  if (/too many/i.test(m)) return L().errRate;
  if (/implausible/i.test(m)) return L().errImplausible;
  if (/invalid name/i.test(m)) return L().errName;
  if (/could not find the function|schema cache|does not exist/i.test(m)) return L().errOutdated;
  if (/fetch|network/i.test(m)) return L().errNet;

// 서버가 없을 때: 이 기기 안에서도 닉네임당 한 줄, 최고 기록만 남깁니다.
function loadLocal() {
  let list = [];
  try { list = JSON.parse(store.get('bullet.local') || '[]'); } catch (e) {}
  const by = new Map();
  for (const r of list) {
    if (!r || !r.name || (r.mode && r.mode !== 'normal')) continue;
    const k = r.name.toLowerCase(), cur = by.get(k);
    if (!cur || r.score > cur.score) by.set(k, { name: r.name, country: 'UN', score: r.score, stage: r.stage });
  }
  return [...by.values()].sort((a, b) => b.score - a.score);
}
function saveLocal(name, score, stage) {
  const list = loadLocal();
  const cur = list.find(r => r.name.toLowerCase() === name.toLowerCase());
  const improved = !cur || score > cur.score;
  if (!cur) list.push({ name, country: 'UN', score, stage });
  else if (improved) Object.assign(cur, { name, score, stage });
  list.sort((a, b) => b.score - a.score);
  store.set('bullet.local', JSON.stringify(list.slice(0, 100)));
  return { improved, best: improved ? score : cur.score };
}

/* ───────────── 업데이트 ───────────── */
function update(rdt) {
  S.stateT += rdt;
  applyAim(rdt);
  // 숨: 참는 동안 줄고, 다 쓰면 한동안 크게 흔들립니다.
  if (S.holding && !S.winded && S.state === 'aim') { S.breath -= rdt / 4; if (S.breath <= 0) { S.breath = 0; S.winded = true; } }
  else { S.breath = Math.min(1, S.breath + rdt / 3); if (S.winded && S.breath > 0.5) S.winded = false; }

  let tsGoal = 1;
  if (S.state === 'flight') {
    const b = S.bullet, T = S.target, prog = b.z / T.z;
    tsGoal = S.tsBase * (b.near && prog > 0.75 && prog < 1.05 ? 0.45 : 1);
    if (b.near && prog > 0.7 && !b.whoosh) { b.whoosh = true; sfx.whoosh(); }
  } else if (S.state === 'result' && S.result.hit) tsGoal = S.stateT < 0.6 ? 0.05 : 0.6;
  S.ts = S.state === 'flight' && S.stateT < 0.02 ? tsGoal : damp(S.ts, tsGoal, 8, rdt);
  const dt = rdt * S.ts;
  if (S.target) S.time += dt;

  if (S.state === 'fired' && S.stateT > 0.12) { setState('flight'); S.ts = S.tsBase; }
  if (S.state === 'flight') {
    S.physAcc += dt;
    while (S.physAcc >= PHYS_DT && S.state === 'flight') { S.physAcc -= PHYS_DT; physStep(); }
  }
  if (S.state === 'result' && S.bullet && S.bullet.stuck) { const tp = targetPos(); S.bullet.x = tp.x + S.bullet.dx; S.bullet.y = tp.y + S.bullet.dy; }
  if (S.state === 'result' && S.stateT > (S.result.hit ? 2.6 : 1.6)) afterResult();

  for (const p of S.particles) { p.vy -= G * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.z += p.vz * dt; p.life -= dt;
    if (p.y < 0.02) { p.y = 0.02; p.vy *= -0.3; p.vx *= 0.6; p.vz *= 0.6; } }
  S.particles = S.particles.filter(p => p.life > 0);
  if (S.particles.length > 150) S.particles.splice(0, S.particles.length - 150);
  for (const r of S.rings) r.age += dt; S.rings = S.rings.filter(r => r.age < 0.5);

}

  g.fillStyle = '#0d0e10';
  g.fillRect(cx - 0.45 * u, cy, 0.9 * u, 18 * u);
  g.beginPath(); g.moveTo(cx - 5.5 * u, cy + 18 * u); g.lineTo(cx - 4.2 * u, cy + 1.5 * u); g.lineTo(cx - 3.2 * u, cy + 1.5 * u); g.lineTo(cx - 3.6 * u, cy + 18 * u); g.closePath(); g.fill();
  g.beginPath(); g.moveTo(cx + 5.5 * u, cy + 18 * u); g.lineTo(cx + 4.2 * u, cy + 1.5 * u); g.lineTo(cx + 3.2 * u, cy + 1.5 * u); g.lineTo(cx + 3.6 * u, cy + 18 * u); g.closePath(); g.fill();
  g.fillRect(cx - 5.5 * u, cy + 16 * u, 11 * u, 3 * u);
  const vg = g.createRadialGradient(cx, cy, 18 * u, cx, cy, Math.max(W, H) * 0.7);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,.45)');
  g.fillStyle = vg; g.fillRect(0, 0, W, H);
  LY.sights = c;
  // 탄 추적 화면의 비네트: 부드러운 그라디언트라 1/4 해상도로 충분합니다.
  const vw = Math.max(16, W / 4), vh = Math.max(16, H / 4), v = mkLayer(vw, vh), vgc = v.getContext('2d');
  const r = vgc.createRadialGradient(vw / 2, vh / 2, Math.min(vw, vh) * 0.3, vw / 2, vh / 2, Math.max(vw, vh) * 0.75);
  r.addColorStop(0, 'rgba(10,5,0,0)'); r.addColorStop(1, 'rgba(10,5,0,1)');
  vgc.fillStyle = r; vgc.fillRect(0, 0, vw, vh);
  LY.vignette = v;
}
const lowDetail = () => Q < 0.8;

/* ───────────── 그리기 ───────────── */
function windPose(phase) {
  const lift = clamp(Math.abs(S.wind) / 8, 0, 1), dir = S.wind >= 0 ? 1 : -1;
  const f = Math.sin(performance.now() / (90 + 60 * (1 - lift)) + phase) * (0.04 + 0.08 * lift);
  return { dx: dir * lift, dy: -(1 - lift) * 0.95 + f, flutter: f };
}
function drawSky() {
  const hz = H / 2 + F * Math.tan(C.pitch), skyTop = hz - H * 1.1;
  if (skyTop > 0) { ctx.fillStyle = '#1f3f7a'; ctx.fillRect(0, 0, W, skyTop); }
  ctx.drawImage(LY.sky, 0, skyTop, W, H * 1.1);
  // 태양
  const sun = proj(C.x + Math.sin(0.5) * 1000, C.y + 70, C.z + Math.cos(0.5) * 1000);
  if (sun) ctx.drawImage(LY.sun, sun.x - 180, sun.y - 180, 360, 360);
  // 산 (지평선 위 실루엣)
  for (const [col, amp, seed] of [['rgba(120,96,140,.8)', 3.2, 1.3], ['rgba(84,72,104,.95)', 1.8, 4.1]]) {
    ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(0, H);
    const stepX = lowDetail() ? 16 : 8;
    for (let x = 0; x <= W + stepX; x += stepX) {
      const ang = C.yaw + Math.atan((x - W / 2) / F);
      const e = amp * DEG * (0.55 + 0.25 * Math.sin(ang * 9 + seed) + 0.14 * Math.sin(ang * 23 + seed * 2) + 0.06 * Math.sin(ang * 57));
      ctx.lineTo(x, hz - F * Math.tan(e + C.pitch) + F * Math.tan(C.pitch));
    }
    ctx.lineTo(W, H); ctx.closePath(); ctx.fill();
  }
  return hz;
}
function drawGround(hz) {
  if (hz < H) ctx.drawImage(LY.ground, 0, hz, W, H - hz);
  // 사로 경계선과 10m 간격 선
  ctx.strokeStyle = 'rgba(255,255,255,.12)'; ctx.lineWidth = 1; ctx.beginPath();
  for (let z = 10; z <= 200; z += 10) {
    const a = proj(-30, 0, z), b = proj(30, 0, z);
    if (a && b) { ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); }
  }
  for (const x of [-6, 6]) {
    let prev = null;
    const near = lowDetail() ? 4 : 1;
    for (let z = Math.max(1, C.z + 0.5); z <= 220; z += z < 20 ? near : 5) { const p = proj(x, 0, z); if (p && prev) { ctx.moveTo(prev.x, prev.y); ctx.lineTo(p.x, p.y); } prev = p; }
  }
  ctx.stroke();
}
function drawTree(t) {
  const b = proj(t.x, 0, t.z), top = proj(t.x, t.h, t.z); if (!b || !top) return;
  const w = t.w * b.s, h = b.y - top.y;
  ctx.fillStyle = '#4a3423'; ctx.fillRect(b.x - 0.12 * b.s, b.y - h * 0.45, 0.24 * b.s, h * 0.45);
  ctx.fillStyle = t.shade < 0.5 ? '#2f5a35' : '#3b6b3b';
  for (let i = 0; i < 3; i++) {
    const cy = b.y - h * (0.42 + i * 0.18), ww = w * (1 - i * 0.25);
    ctx.beginPath(); ctx.moveTo(b.x - ww, cy); ctx.lineTo(b.x, cy - h * 0.36); ctx.lineTo(b.x + ww, cy); ctx.closePath(); ctx.fill();
  }
}
function drawFlag(f) {
  const base = proj(f.x, 0, f.z), top = proj(f.x, f.h, f.z); if (!base || !top) return;
  ctx.strokeStyle = '#ddd'; ctx.lineWidth = Math.max(1, 0.06 * base.s);
  ctx.beginPath(); ctx.moveTo(base.x, base.y); ctx.lineTo(top.x, top.y); ctx.stroke();
  const pose = windPose(f.phase), len = 1.2;
  const tip = proj(f.x + pose.dx * len, f.h + pose.dy * len * 0.6 - 0.15, f.z), low = proj(f.x, f.h - 0.4, f.z);
  if (tip && low) {
    ctx.fillStyle = f.near ? '#ffd23f' : '#ff6a2b';
    ctx.beginPath(); ctx.moveTo(top.x, top.y); ctx.lineTo(tip.x, tip.y); ctx.lineTo(low.x, low.y); ctx.closePath(); ctx.fill();
  }
  if (f.label && base.s > 6) {
    ctx.fillStyle = 'rgba(20,20,20,.7)'; const sw = 1.1 * base.s, sh = 0.5 * base.s, sy = base.y - 1.3 * base.s;
    ctx.fillRect(base.x - sw / 2, sy, sw, sh);
    ctx.fillStyle = '#fff'; ctx.font = `600 ${clamp(0.38 * base.s, 8, 18)}px system-ui, sans-serif`; ctx.textAlign = 'center';
    ctx.fillText(`${f.label}m`, base.x, sy + sh * 0.75);
  }
}
function drawTarget() {
  const T = S.target, tp = targetPos(), c = proj(tp.x, tp.y, T.z); if (!c) return;
  const r = T.R * c.s;
  // 받침대 / 레일
  ctx.strokeStyle = '#6b4a2b'; ctx.lineWidth = Math.max(1.5, 0.1 * c.s);
  const gl = proj(tp.x - 0.6, 0, T.z), gr = proj(tp.x + 0.6, 0, T.z), bot = proj(tp.x, tp.y - T.R, T.z);
  if (T.amp > 0) {
    const l = proj(T.x - T.amp - T.R - 0.3, tp.y - T.R - 0.1, T.z), rr = proj(T.x + T.amp + T.R + 0.3, tp.y - T.R - 0.1, T.z);
    const l0 = proj(T.x - T.amp - T.R - 0.3, 0, T.z), r0 = proj(T.x + T.amp + T.R + 0.3, 0, T.z);
    ctx.strokeStyle = '#5a6470';
    if (l && rr && l0 && r0) { ctx.beginPath(); ctx.moveTo(l.x, l.y); ctx.lineTo(rr.x, rr.y); ctx.moveTo(l.x, l.y); ctx.lineTo(l0.x, l0.y); ctx.moveTo(rr.x, rr.y); ctx.lineTo(r0.x, r0.y); ctx.stroke(); }
  } else if (gl && gr && bot) {
    ctx.beginPath(); ctx.moveTo(gl.x, gl.y); ctx.lineTo(bot.x, bot.y); ctx.lineTo(gr.x, gr.y); ctx.stroke();
  }
  ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.beginPath(); ctx.arc(c.x + r * 0.06, c.y + r * 0.06, r * 1.03, 0, Math.PI * 2); ctx.fill();
  const cols = ['#f4f1ea', '#f4f1ea', '#262626', '#262626', '#1d6fd1', '#1d6fd1', '#e63946', '#e63946', '#ffd23f', '#ffd23f'];
  for (let i = 10; i >= 1; i--) {
    ctx.fillStyle = cols[10 - i]; ctx.beginPath(); ctx.arc(c.x, c.y, Math.max(0.6, r * i / 10), 0, Math.PI * 2); ctx.fill();
    if (r > 30) { ctx.strokeStyle = 'rgba(0,0,0,.25)'; ctx.lineWidth = 1; ctx.stroke(); }
  }
  ctx.strokeStyle = '#3b2a1a'; ctx.lineWidth = Math.max(1, 0.05 * c.s); ctx.beginPath(); ctx.arc(c.x, c.y, r, 0, Math.PI * 2); ctx.stroke();
  for (const m of S.marks) {
    const p = proj(tp.x + m.dx, tp.y + m.dy, T.z - 0.01); if (!p) continue;
    const mr = Math.max(1.2, 0.04 * p.s);
    ctx.fillStyle = 'rgba(255,255,255,.5)'; ctx.beginPath(); ctx.arc(p.x, p.y, mr * 1.7, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(p.x, p.y, mr, 0, Math.PI * 2); ctx.fill();
  }
}
function drawBullet() {
  const b = S.bullet; if (!b || b.stuck) return;
  for (let i = 1; i < S.trail.length; i++) {
    const p0 = proj(S.trail[i - 1].x, S.trail[i - 1].y, S.trail[i - 1].z), p1 = proj(S.trail[i].x, S.trail[i].y, S.trail[i].z);
    if (!p0 || !p1) continue; const a = i / S.trail.length;
    ctx.strokeStyle = `rgba(255,${Math.round(200 + 55 * a)},${Math.round(150 + 80 * a)},${a * 0.8})`;
    ctx.lineWidth = clamp(0.03 * p1.s * a, 1, 5); ctx.beginPath(); ctx.moveTo(p0.x, p0.y); ctx.lineTo(p1.x, p1.y); ctx.stroke();
  }
  for (const r of S.rings) {
    const p = proj(r.x, r.y, r.z); if (!p) continue; const t = r.age / 0.5;
    ctx.strokeStyle = `rgba(255,255,255,${0.5 * (1 - t)})`; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(p.x, p.y, (0.1 + t * 0.9) * p.s, 0, Math.PI * 2); ctx.stroke();
  }
  const sp = Math.hypot(b.vx, b.vy, b.vz), head = proj(b.x, b.y, b.z), tail = proj(b.x - b.vx / sp * 0.08, b.y - b.vy / sp * 0.08, b.z - b.vz / sp * 0.08);
  if (!head) return;
  const rad = Math.max(2.5, 0.025 * head.s);
  ctx.drawImage(LY.glow, head.x - rad * 5, head.y - rad * 5, rad * 10, rad * 10);
  ctx.fillStyle = '#d49a3a'; ctx.beginPath(); ctx.arc(head.x, head.y, rad, 0, Math.PI * 2); ctx.fill();
  if (tail) { ctx.strokeStyle = '#8a5a1c'; ctx.lineWidth = rad * 1.4; ctx.beginPath(); ctx.moveTo(tail.x, tail.y); ctx.lineTo(head.x, head.y); ctx.stroke(); }
}
function drawParticles() {
  for (const p of S.particles) {
    const q = proj(p.x, p.y, p.z); if (!q) continue;
    ctx.fillStyle = `rgba(${p.color},${clamp(p.life / p.max, 0, 1)})`; const s = Math.max(1.2, p.size * q.s);
    ctx.fillRect(q.x - s / 2, q.y - s / 2, s, s);
  }
}
// 가늠자(뒤 고리)와 가늠쇠(앞 기둥): 기둥 끝이 정확히 화면 가운데 = 조준점
function drawIronSights() {
  const cx = W / 2, cy = H / 2, u = Math.min(W, H) / 100;
  const k = REDUCED_MOTION ? 0 : S.shake * 6, ox = k ? rand(-k, k) : 0, oy = k ? rand(-k, k) : 0;
  ctx.drawImage(LY.sights, ox, oy, W, H);
  // 총구 화염
  if (S.flash > 0) {
    ctx.fillStyle = `rgba(255,236,170,${Math.min(1, S.flash * 9)})`;
    ctx.beginPath(); ctx.arc(cx + ox, cy - u + oy, 9 * u, 0, Math.PI * 2); ctx.fill();
    if (!REDUCED_MOTION) { ctx.fillStyle = `rgba(255,250,230,${S.flash * 4})`; ctx.fillRect(0, 0, W, H); }
  }
}
function drawPopup() {
  const p = S.popup; if (!p) return;
  const a = p.age < 0.15 ? p.age / 0.15 : p.age > 1.9 ? Math.max(0, (2.4 - p.age) / 0.5) : 1;
  ctx.globalAlpha = a; ctx.textAlign = 'center';
  ctx.font = `800 ${Math.round(clamp(W / 16, 28, 56))}px system-ui, sans-serif`;
  ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(0,0,0,.6)'; ctx.strokeText(p.title, W / 2, H * 0.2); ctx.fillStyle = p.gold ? '#ffd23f' : '#fff'; ctx.fillText(p.title, W / 2, H * 0.2);
  ctx.font = `700 ${Math.round(clamp(W / 40, 14, 22))}px system-ui, sans-serif`;
  ctx.lineWidth = 4; ctx.strokeText(p.sub, W / 2, H * 0.2 + 34); ctx.fillStyle = '#ffe8a8'; ctx.fillText(p.sub, W / 2, H * 0.2 + 34);
  ctx.globalAlpha = 1;
}
function render() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  if (!S.target) { ctx.fillStyle = '#0b1622'; ctx.fillRect(0, 0, W, H); return; }
  cameraFor();
  const hz = drawSky(); drawGround(hz);
  const items = [];
  for (const t of S.trees) items.push({ z: t.z - C.z, f: () => drawTree(t) });
  for (const f of S.flags) items.push({ z: f.z - C.z + 0.01, f: () => drawFlag(f) });
  items.push({ z: S.target.z - C.z, f: drawTarget });
  items.sort((a, b) => b.z - a.z);
  for (const it of items) it.f();
  drawParticles(); drawBullet();
  const fpv = S.state === 'aim' || S.state === 'fired' || (S.state === 'result' && !S.result.hit);
  if (fpv) drawIronSights();
  else {
    const slow = clamp(1 - S.ts / Math.max(0.05, S.tsBase) * 0.6, 0, 1), bar = H * 0.07;
    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, bar); ctx.fillRect(0, H - bar, W, bar);
    if (slow > 0) { ctx.globalAlpha = 0.5 * slow; ctx.drawImage(LY.vignette, 0, 0, W, H); ctx.globalAlpha = 1; }
  }
  drawPopup();
}

/* ───────────── HUD ───────────── */
const infoEl = document.getElementById('info'), hintEl = document.getElementById('hint');
const breathEl = document.getElementById('breath'), breathBar = document.getElementById('breathBar'), breathLabel = document.getElementById('breathLabel');
let lastInfo = '';
function updateHud() {
  const playing = S.state !== 'title' && S.state !== 'gameover' && S.target;
  infoEl.hidden = breathEl.hidden = !playing;
  fireBtn.style.visibility = holdBtn.style.visibility = playing && S.state === 'aim' ? 'visible' : 'hidden';
  if (!playing) { hintEl.hidden = true; return; }
  const T = S.target, w = S.wind, aw = Math.abs(w), lv = aw < 2 ? 0 : aw < 4 ? 1 : aw < 6 ? 2 : 3, bars = Math.min(5, Math.ceil(aw / 1.6));
  const ammo = Array.from({ length: 3 }, (_, i) => `<span class="${i < S.ammo ? '' : 'used'}"></span>`).join('');
  const html =
    `<div class="row"><span>${L().stage}</span><b>${S.stage}</b></div>` +
    `<div class="row"><span>${L().score}</span><b>${S.score.toLocaleString()}</b></div>` +
    `<div class="row"><span>${L().ammo}</span><span id="ammo">${ammo}</span></div><div class="sep"></div>` +
    `<div class="row"><span>${L().dist}</span><span>${T.z.toFixed(0)} m</span></div>` +
    `<div class="row"><span>${L().wind}</span><span>${windLabel()}</span></div>` +
    (aw >= 0.05 ? `<div class="row"><span></span><span class="bars">${'<b class="on"></b>'.repeat(bars)}${'<b></b>'.repeat(5 - bars)} ${L().windLv[lv]}</span></div>` : '') +
    (T.amp ? `<div class="row"><span></span><span>${L().moving}</span></div>` : '') +
    (S.feedback ? `<div class="sep"></div><div class="fb">${S.feedback}</div>` : '');
  if (html !== lastInfo) { infoEl.innerHTML = html; lastInfo = html; }
  const needLock = S.state === 'aim' && !touchUI && canLock && !lockFailed && !locked();
  hintEl.hidden = !needLock; if (needLock) hintEl.textContent = L().lockHint;
  const bl = S.winded ? L().breathOut : S.holding ? L().breathHold : L().breath, bw = Math.round(S.breath * 50) * 2 + '%', bc = S.winded ? '#ff8a8a' : '#9fe9ff';
  if (breathLabel.textContent !== bl) breathLabel.textContent = bl;
  if (breathBar.style.width !== bw) breathBar.style.width = bw;
  if (breathBar.dataset.c !== bc) { breathBar.style.background = bc; breathBar.dataset.c = bc; }
}

/* ───────────── 루프 ───────────── */
// 프레임 시간이 길게 이어지면 해상도를 한 단계 낮추고, 충분히 빠르면 다시 올립니다.
let ema = 16.7, slowT = 0, fastT = 0;
function adapt(rdt) {
  if (S.state === 'title' || S.state === 'gameover') return;
  ema += (rdt * 1000 - ema) * 0.05;
  if (ema > 24) { slowT += rdt; fastT = 0; } else if (ema < 18.5) { fastT += rdt; slowT = 0; } else { slowT = fastT = 0; }
  if (slowT > 1 && Q > Q_MIN) { Q = Math.max(Q_MIN, +(Q - 0.15).toFixed(2)); slowT = 0; ema = 16.7; resize(); }
  else if (fastT > 8 && Q < Q_MAX) { Q = Math.min(Q_MAX, +(Q + 0.15).toFixed(2)); fastT = 0; resize(); }
}
let last = performance.now(), lastDraw = -Infinity, wasIdle = false;
function frame(now) {
  const rdt = Math.min(0.05, (now - last) / 1000); last = now;
  update(rdt);
  // 제목·결과·랭킹 화면이 덮고 있을 때는 배경을 1초에 한 번만 그립니다.
  const idle = !overlay.classList.contains('hidden');
  if (!idle || !wasIdle || now - lastDraw > 1000) { render(); lastDraw = now; }
  wasIdle = idle;
  if (!idle) adapt(rdt);
  updateHud();
  requestAnimationFrame(frame);
}
// 다른 탭으로 가면 소리 엔진도 쉽니다(화면 갱신은 브라우저가 자동으로 멈춤).
document.addEventListener('visibilitychange', () => {
  if (!actx) return;
  if (document.hidden) actx.suspend(); else if (!muted) actx.resume();
});
S.debug = { predict, targetPos, quality: () => Q, setAim, addInput, smooth: v => { SMOOTH = v; } }; // 테스트용
resize();
makeStage(1);
applyStaticText();
showTitle();
requestAnimationFrame(frame);
})();
</script>
