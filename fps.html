<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>BULLET FPS — Iron Sights</title>
<meta name="description" content="BULLET first-person prototype: iron sights only, no magnification. Read the distance and crosswind, hold your breath, and fire.">
<meta name="theme-color" content="#0b1622">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23f4f1ea'/%3E%3Ccircle cx='16' cy='16' r='12' fill='%23262626'/%3E%3Ccircle cx='16' cy='16' r='9' fill='%231d6fd1'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23e63946'/%3E%3Ccircle cx='16' cy='16' r='3' fill='%23ffd23f'/%3E%3C/svg%3E">
<style>
  :root { --panel: rgba(12, 18, 32, .58); --accent: #ffcf3f; color-scheme: dark; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b1622; color: #fff;
    font-family: system-ui, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
    user-select: none; -webkit-user-select: none; touch-action: none; }
  canvas { display: block; position: fixed; inset: 0; width: 100%; height: 100%; cursor: crosshair; }
  #hud { position: fixed; inset: 0; pointer-events: none; }
  .panel { position: absolute; background: var(--panel); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
    border-radius: 10px; padding: 8px 12px; font-size: 13px; line-height: 1.55; font-variant-numeric: tabular-nums; }
  #info { left: calc(12px + env(safe-area-inset-left, 0px)); top: calc(12px + env(safe-area-inset-top, 0px)); min-width: 160px; }
  #info b { color: var(--accent); }
  #info .row { display: flex; justify-content: space-between; gap: 14px; }
  #info .sep { height: 1px; background: rgba(255,255,255,.18); margin: 5px 0; }
  #info .bars b { display: inline-block; width: 6px; height: 11px; margin-right: 2px; border-radius: 1px;
    background: rgba(255,255,255,.18); vertical-align: -1px; }
  #info .bars b.on { background: #9fe9ff; }
  #info .fb { color: #ffd27a; max-width: 220px; }
  #ammo span { display: inline-block; width: 6px; height: 15px; margin-right: 3px; border-radius: 3px 3px 1px 1px;
    background: linear-gradient(#ffe39a, #c8902b); vertical-align: -3px; }
  #ammo span.used { background: rgba(255,255,255,.18); }
  #breath { left: 50%; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); width: min(220px, 50vw);
    padding: 6px 10px; font-size: 11px; text-align: center; }
  #breath .bar { height: 5px; border-radius: 3px; background: rgba(255,255,255,.18); margin-top: 4px; overflow: hidden; }
  #breath .bar i { display: block; height: 100%; background: #9fe9ff; transition: width .1s linear; }
  #hint { left: 50%; top: calc(12px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); font-size: 12px; text-align: center; max-width: 60vw; }
  #banner { position: absolute; left: 50%; top: 24%; transform: translate(-50%, -50%); text-align: center;
    text-shadow: 0 2px 12px rgba(0,0,0,.6); transition: opacity .35s; opacity: 0; white-space: nowrap; }
  #banner h2 { margin: 0; font-size: clamp(30px, 7vw, 54px); letter-spacing: .06em; }
  #banner p { margin: 6px 0 0; font-size: clamp(14px, 3.4vw, 18px); opacity: .92; }
  .tbtn { position: absolute; pointer-events: auto; border: 0; border-radius: 999px; font-weight: 800; color: #fff;
    background: rgba(12,18,32,.6); border: 2px solid rgba(255,255,255,.35); width: 76px; height: 76px; font-size: 14px; }
  #fire { right: calc(18px + env(safe-area-inset-right, 0px)); bottom: calc(70px + env(safe-area-inset-bottom, 0px));
    background: rgba(230,57,70,.75); border-color: rgba(255,255,255,.6); width: 86px; height: 86px; font-size: 16px; }
  #hold { right: calc(118px + env(safe-area-inset-right, 0px)); bottom: calc(60px + env(safe-area-inset-bottom, 0px)); width: 64px; height: 64px; font-size: 12px; }
  #mute { position: absolute; right: calc(12px + env(safe-area-inset-right, 0px)); bottom: calc(12px + env(safe-area-inset-bottom, 0px));
    pointer-events: auto; background: var(--panel); color: #fff; border: 0; border-radius: 10px; padding: 8px 12px; font-size: 14px; cursor: pointer; }
  #overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: radial-gradient(ellipse at center, rgba(8,12,24,.55), rgba(4,6,14,.85)); }
  #overlay.hidden { display: none; }
  .card { position: relative; width: min(460px, calc(100vw - 32px)); max-height: calc(100% - 32px); overflow-y: auto; touch-action: pan-y;
    box-sizing: border-box; text-align: center; padding: 28px 22px; background: rgba(14, 20, 36, .85);
    border: 1px solid rgba(255,255,255,.12); border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,.5); }
  .card h1 { margin: 0 0 2px; font-size: 40px; letter-spacing: .12em; color: var(--accent); }
  .card .tag { display: inline-block; font-size: 12px; font-weight: 700; letter-spacing: .08em; padding: 2px 8px; border-radius: 999px;
    background: rgba(159,233,255,.15); color: #9fe9ff; margin-bottom: 10px; }
  .card .sub { margin: 0 0 16px; opacity: .85; }
  .card ul { text-align: left; margin: 0 0 18px; padding-left: 20px; line-height: 1.7; font-size: 14px; opacity: .92; }
  .card .big { font-size: 40px; font-weight: 800; color: var(--accent); margin: 6px 0; }
  .card .btns { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .card button, .card a.btn { pointer-events: auto; background: var(--accent); color: #1b1300; border: 0; border-radius: 999px;
    padding: 12px 30px; font-size: 16px; font-weight: 800; cursor: pointer; letter-spacing: .04em; text-decoration: none; font-family: inherit; }
  .card .ghost { background: rgba(255,255,255,.12) !important; color: #fff !important; }
  .card .lang { position: absolute; top: 12px; right: 12px; padding: 5px 10px; font-size: 12px; font-weight: 600; }
  .note { font-size: 12px; opacity: .65; margin: 12px 0 0; }
  kbd { background: rgba(255,255,255,.14); border-radius: 4px; padding: 0 5px; font-size: 12px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div id="info" class="panel"></div>
  <div id="hint" class="panel" hidden></div>
  <div id="breath" class="panel"><span id="breathLabel"></span><div class="bar"><i id="breathBar"></i></div></div>
  <div id="banner"><h2></h2><p></p></div>
  <button id="hold" class="tbtn" hidden></button>
  <button id="fire" class="tbtn" hidden></button>
  <button id="mute" title="Sound (M)">🔊</button>
</div>
<div id="overlay"><div class="card" id="card"></div></div>

<script>
(() => {
'use strict';

/* ───────────── 화면 ───────────── */
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1, F = 1000;
const HFOV = 50 * Math.PI / 180; // 고정 시야각: 확대 없음
function resize() {
  DPR = Math.min(2, devicePixelRatio || 1); W = innerWidth; H = innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  F = (Math.max(W, H) / 2) / Math.tan(HFOV / 2);
}
addEventListener('resize', resize); resize();

/* ───────────── 상수 ───────────── */
const G = 9.8, V0 = 260, EYE = 1.55, WIND_LAT = 1.4, PHYS_DT = 1 / 480;
const DEG = Math.PI / 180;
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const damp = (a, b, r, dt) => lerp(a, b, 1 - Math.exp(-r * dt));
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
};
const touchUI = matchMedia('(pointer:coarse)').matches;

/* ───────────── 다국어 ───────────── */
const I18N = {
  ko: {
    tag: '1인칭 시험판', sub: '확대 조준경 없이, 가늠쇠 하나로',
    rules: [
      touchUI ? '<b>드래그</b>로 조준하고 <b>발사</b> 버튼으로 쏩니다' : '화면을 <b>클릭</b>하면 마우스로 조준합니다(<kbd>Esc</kbd>로 해제). 다시 <b>클릭</b>하거나 <kbd>Space</kbd>로 발사',
      '가늠쇠 끝이 조준점입니다. 탄은 <b>중력</b>으로 떨어지니 먼 표적은 <b>위를</b> 겨누세요',
      '<b>옆바람</b>이 탄을 좌우로 밉니다. 깃발과 바람 표시를 보고 바람 반대쪽을 겨누세요',
      touchUI ? '<b>숨 참기</b> 버튼을 누르는 동안 흔들림이 줄어듭니다' : '<kbd>Shift</kbd>를 누르는 동안 <b>숨을 참아</b> 흔들림을 줄입니다',
      '스테이지마다 탄 3발. 명중하면 다음 스테이지',
    ],
    start: '사격 시작', back: '← 2D 버전', langToggle: 'English',
    note: '시험판이라 세계 랭킹에는 아직 연결되지 않았어요',
    stage: 'STAGE', score: '점수', ammo: '탄약', dist: '거리', wind: '바람', windNone: '없음', height: '높이',
    windLv: ['약함', '보통', '강함', '매우 강함'], moving: '움직이는 표적',
    introInfo: (d, w) => `거리 ${d}m · ${w}`,
    windTxt: (dir, v) => `${dir === 1 ? '→ 오른쪽으로' : '← 왼쪽으로'} ${v} m/s`,
    bullseye: '불스아이!', great: '훌륭해요!', hit: '명중!', close: '아슬아슬!',
    ringPts: (r, p, f) => `${r}점 링 · +${p}${f ? ' (원샷 ×1.5)' : ''}`,
    missAt: (h, v) => `빗나감: ${h}${h && v ? ' · ' : ''}${v}`,
    left: d => `왼쪽 ${d}m`, right: d => `오른쪽 ${d}m`, up: d => `위 ${d}m`, down: d => `아래 ${d}m`,
    short: d => `빗나감: 표적 ${d}m 앞 지면 (너무 낮음)`,
    hitAt: (h, v) => `탄착: ${h || '중앙'}${v ? ' · ' + v : ''}`,
    breath: '숨', breathHold: '숨 참는 중', breathOut: '숨이 차요',
    hold: '숨\n참기', fire: '발사',
    lockHint: '화면을 클릭하면 조준을 시작해요',
    goTitle: 'GAME OVER', goSub: '탄약을 모두 소진했습니다',
    goStats: (st, b, n) => `도달 스테이지 ${st} · 내 최고 ${b}${n ? ' 🎉 신기록!' : ''}`,
    retry: '다시 도전',
  },
  en: {
    tag: 'FIRST-PERSON PROTOTYPE', sub: 'No scope. Just iron sights.',
    rules: [
      touchUI ? '<b>Drag</b> to aim, tap <b>FIRE</b> to shoot' : '<b>Click</b> the screen to aim with the mouse (<kbd>Esc</kbd> releases). <b>Click</b> again or press <kbd>Space</kbd> to fire',
      'The tip of the front post is your aim point. Bullets drop with <b>gravity</b>, so hold <b>high</b> on far targets',
      '<b>Crosswind</b> pushes the bullet sideways. Read the flags and aim into the wind',
      touchUI ? 'Hold <b>BREATH</b> to steady your aim' : 'Hold <kbd>Shift</kbd> to <b>hold your breath</b> and steady the sway',
      '3 rounds per stage. Hit to advance',
    ],
    start: 'Start', back: '← 2D version', langToggle: '한국어',
    note: 'Prototype: not connected to the world leaderboard yet',
    stage: 'STAGE', score: 'Score', ammo: 'Ammo', dist: 'Distance', wind: 'Wind', windNone: 'None', height: 'Height',
    windLv: ['Light', 'Moderate', 'Strong', 'Very strong'], moving: 'Moving target',
    introInfo: (d, w) => `${d} m · ${w}`,
    windTxt: (dir, v) => `${dir === 1 ? '→ to the right' : '← to the left'} ${v} m/s`,
    bullseye: 'BULLSEYE!', great: 'Great shot!', hit: 'Hit!', close: 'Close call!',
    ringPts: (r, p, f) => `Ring ${r} · +${p}${f ? ' (one-shot ×1.5)' : ''}`,
    missAt: (h, v) => `Miss: ${h}${h && v ? ' · ' : ''}${v}`,
    left: d => `${d} m left`, right: d => `${d} m right`, up: d => `${d} m high`, down: d => `${d} m low`,
    short: d => `Miss: hit the ground ${d} m short (too low)`,
    hitAt: (h, v) => `Impact: ${h || 'centered'}${v ? ' · ' + v : ''}`,
    breath: 'Breath', breathHold: 'Holding breath', breathOut: 'Out of breath',
    hold: 'HOLD\nBREATH', fire: 'FIRE',
    lockHint: 'Click the screen to start aiming',
    goTitle: 'GAME OVER', goSub: 'Out of ammo',
    goStats: (st, b, n) => `Reached stage ${st} · Best ${b}${n ? ' 🎉 New record!' : ''}`,
    retry: 'Play again',
  },
};
let LANG = (() => {
  try { const q = new URLSearchParams(location.search).get('lang'); if (q === 'ko' || q === 'en') return q; } catch (e) {}
  const s = store.get('bullet.lang'); if (s === 'ko' || s === 'en') return s;
  return /^ko\b/i.test(navigator.language || '') ? 'ko' : 'en';
})();
const L = () => I18N[LANG];
document.documentElement.lang = LANG;

/* ───────────── 상태 ───────────── */
const S = {
  state: 'title', stateT: 0, stage: 1, score: 0, streak: 0, ammo: 3, shots: 0, time: 0, ts: 1, tsBase: 1,
  yaw: 0, pitch: 0, breath: 1, holding: false, winded: false, wind: 0,
  target: null, bullet: null, trail: [], rings: [], particles: [], marks: [], trees: [], flags: [],
  feedback: '', popup: null, flash: 0, shake: 0,
};
window.BULLET_FPS = S;
let best = +(store.get('bullet.fps.best') || 0);

function targetPos(t = S.time) {
  const T = S.target;
  return { x: T.x + T.amp * Math.sin(T.freq * t + T.phase), y: T.y, z: T.z };
}

function makeStage(n) {
  const z = Math.min(150, 30 + n * 12 + rand(0, 10));
  const R = Math.max(0.7, 1.4 - n * 0.05);
  const x = n === 1 ? rand(-1, 1) : rand(-1, 1) * Math.min(14, n * 2.5);
  const y = R + 0.4 + (n < 3 ? 0 : rand(0, Math.min(4, n * 0.5)));
  const amp = n >= 4 ? Math.min(4, (n - 3) * 0.8) : 0;
  S.target = { x, y, z, R, amp, freq: rand(0.5, 0.9), phase: rand(0, Math.PI * 2) };
  S.wind = n >= 2 ? (Math.random() < 0.5 ? -1 : 1) * rand(0.35, 1) * Math.min(8, 1 + n) : 0;
  S.ammo = 3; S.shots = 0; S.marks = []; S.feedback = '';
  S.trees = [];
  for (let i = 0; i < 26; i++) {
    const side = i % 2 ? 1 : -1, tz = rand(12, z + 70), tx = side * rand(9, 48);
    const lineX = x * (tz / z);
    if (Math.abs(tx - lineX) < 5) continue;
    S.trees.push({ x: tx, z: tz, h: rand(5, 10), w: rand(1.8, 3.2), shade: Math.random() });
  }
  S.flags = [];
  for (let d = 25; d < z; d += 25) S.flags.push({ x: -4.5, z: d, h: 3.4, label: d, phase: d * 0.3 });
  S.flags.push({ x: x + R + amp + 1.6, z, h: Math.max(3, y + R + 0.8), phase: 2.1, near: true });
}

/* ───────────── 소리 ───────────── */
let actx = null, muted = false, noiseBuf = null;
function audio() {
  if (!actx) {
    try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; }
    const len = actx.sampleRate * 1.5; noiseBuf = actx.createBuffer(1, len, actx.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  }
  if (actx.state === 'suspended') actx.resume();
  return actx;
}
function noise(dur, type, freq, gain, q = 1, freqEnd) {
  const a = audio(); if (!a || muted) return; const t = a.currentTime;
  const src = a.createBufferSource(); src.buffer = noiseBuf;
  const f = a.createBiquadFilter(); f.type = type; f.frequency.setValueAtTime(freq, t); f.Q.value = q;
  if (freqEnd) f.frequency.exponentialRampToValueAtTime(freqEnd, t + dur);
  const g = a.createGain(); g.gain.setValueAtTime(gain, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  src.connect(f).connect(g).connect(a.destination); src.start(t); src.stop(t + dur);
}
function tone(freq, dur, type, gain, freqEnd, delay = 0) {
  const a = audio(); if (!a || muted) return; const t = a.currentTime + delay;
  const o = a.createOscillator(); o.type = type; o.frequency.setValueAtTime(freq, t);
  if (freqEnd) o.frequency.exponentialRampToValueAtTime(freqEnd, t + dur);
  const g = a.createGain(); g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(gain, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t + dur + 0.02);
}
const sfx = {
  shot() { noise(0.6, 'lowpass', 3500, 1, 0.7, 250); tone(120, 0.4, 'sine', 0.9, 30); noise(0.08, 'highpass', 2600, 0.6); },
  whoosh() { noise(0.9, 'bandpass', 600, 0.25, 2, 2400); },
  hit() { tone(320, 0.25, 'triangle', 0.5, 70); noise(0.06, 'highpass', 1800, 0.6); },
  bull() { tone(880, 0.6, 'triangle', 0.25, null, 0.08); tone(1320, 0.8, 'triangle', 0.2, null, 0.18); },
  dirt() { noise(0.3, 'lowpass', 900, 0.35, 0.8, 120); },
  stage() { [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.25, 'square', 0.07, null, i * 0.08)); },
  over() { [392, 330, 262].forEach((f, i) => tone(f, 0.35, 'sawtooth', 0.06, null, i * 0.16)); },
};

/* ───────────── 조준 흔들림 & 숨 ───────────── */
function swayAmp() { return S.winded ? 0.30 * DEG : (S.holding && S.breath > 0 ? 0.015 * DEG : 0.10 * DEG); }
let swayA = 0.1 * DEG;
function sway(t) {
  return {
    yaw: swayA * (Math.sin(t * 1.1) * 0.7 + Math.sin(t * 2.3 + 1) * 0.3),
    pitch: swayA * (Math.sin(t * 0.9 + 2) * 0.6 + Math.sin(t * 1.7) * 0.4) * 0.8,
  };
}
function aimDir() {
  const sw = sway(performance.now() / 1000);
  return { yaw: S.yaw + sw.yaw, pitch: S.pitch + sw.pitch };
}

/* ───────────── 사격 & 물리 ───────────── */
function dirFrom(yaw, pitch) { return { x: Math.sin(yaw) * Math.cos(pitch), y: Math.sin(pitch), z: Math.cos(yaw) * Math.cos(pitch) }; }
function step(b, dt) { b.vx += WIND_LAT * S.wind * dt; b.vy -= G * dt; b.x += b.vx * dt; b.y += b.vy * dt; b.z += b.vz * dt; }
function predict(yaw, pitch) {
  const d = dirFrom(yaw, pitch), T = S.target;
  const b = { x: 0, y: EYE, z: 0, vx: d.x * V0, vy: d.y * V0, vz: d.z * V0 }; let t = 0;
  while (t < 3) {
    const pz = b.z, px = b.x, py = b.y; step(b, PHYS_DT); t += PHYS_DT;
    if (b.z >= T.z) { const f = (T.z - pz) / (b.z - pz); return { reach: true, x: px + (b.x - px) * f, y: py + (b.y - py) * f, t }; }
    if (b.y < 0) return { reach: false, t };
  }
  return { reach: false, t };
}

function fire() {
  if (S.state !== 'aim' || S.ammo <= 0) return;
  audio();
  const a = aimDir(), d = dirFrom(a.yaw, a.pitch);
  S.bullet = { x: 0, y: EYE, z: 0, vx: d.x * V0, vy: d.y * V0, vz: d.z * V0, t: 0, crossed: false, whoosh: false };
  const P = predict(a.yaw, a.pitch);
  let near = false;
  if (P.reach) { const tp = targetPos(S.time + P.t); near = Math.hypot(P.x - tp.x, P.y - tp.y) <= S.target.R + 1.0; }
  S.bullet.near = near;
  S.tsBase = clamp(P.t / (near ? 2.4 : 0.9), 0.04, 1);
  S.trail = []; S.rings = []; S.nextRing = 4; S.physAcc = 0;
  S.ammo--; S.shots++; S.flash = 0.08; S.shake = 0.5; S.feedback = '';
  sfx.shot();
  setState('fired');
}

function physStep() {
  const b = S.bullet, T = S.target;
  const px = b.x, py = b.y, pz = b.z;
  step(b, PHYS_DT); b.t += PHYS_DT;
  if (!b.crossed && pz < T.z && b.z >= T.z) {
    const f = (T.z - pz) / (b.z - pz), hx = px + (b.x - px) * f, hy = py + (b.y - py) * f;
    const tp = targetPos(), dx = hx - tp.x, dy = hy - tp.y;
    b.crossed = true; b.dx = dx; b.dy = dy;
    if (Math.hypot(dx, dy) <= T.R) { onHit(hx, hy, dx, dy); return; }
  }
  S.trail.push({ x: b.x, y: b.y, z: b.z }); if (S.trail.length > 120) S.trail.shift();
  if (b.z >= S.nextRing) { S.rings.push({ x: b.x, y: b.y, z: b.z, age: 0 }); S.nextRing += 6; }
  if (b.y <= 0) { dust(b.x, 0, b.z); onMiss(); return; }
  if (b.z > T.z + 60 || b.t > 3) onMiss();
}

function dust(x, y, z) {
  for (let i = 0; i < 26; i++) S.particles.push({ x, y: y + 0.05, z, vx: rand(-2, 2), vy: rand(1, 5), vz: rand(-2, 2),
    life: rand(0.6, 1.4), max: 1.4, size: rand(0.05, 0.16), color: i % 3 ? '120,92,58' : '86,140,60' });
  sfx.dirt();
}

const offText = (dx, dy) => {
  const h = Math.abs(dx) < 0.05 ? '' : (dx > 0 ? L().right : L().left)(Math.abs(dx).toFixed(1));
  const v = Math.abs(dy) < 0.05 ? '' : (dy > 0 ? L().up : L().down)(Math.abs(dy).toFixed(1));
  return [h, v];
};

function onHit(hx, hy, dx, dy) {
  const T = S.target, b = S.bullet;
  b.stuck = true; b.dx = dx; b.dy = dy; b.x = hx; b.y = hy; b.z = T.z;
  S.marks.push({ dx, dy });
  const ring = Math.max(1, 10 - Math.floor(Math.hypot(dx, dy) / T.R * 10));
  const first = S.shots === 1;
  S.streak = first ? S.streak + 1 : 0;
  const pts = Math.round((ring * 10 + Math.round(T.z)) * (first ? 1.5 : 1)) + (first && S.streak > 1 ? (S.streak - 1) * 25 : 0);
  S.score += pts;
  const label = ring === 10 ? L().bullseye : ring >= 8 ? L().great : ring >= 5 ? L().hit : L().close;
  S.popup = { title: label, sub: L().ringPts(ring, pts, first), gold: ring === 10, age: 0 };
  const [h, v] = offText(dx, dy); S.feedback = L().hitAt(h, v);
  const cols = ['244,241,234', '230,57,70', '29,111,209', '255,210,63', '150,110,70'];
  for (let i = 0; i < 40; i++) S.particles.push({ x: hx, y: hy, z: T.z - 0.05, vx: rand(-4, 4), vy: rand(-1, 5), vz: rand(-6, -1),
    life: rand(0.6, 1.5), max: 1.5, size: rand(0.03, 0.09), color: cols[i % cols.length] });
  sfx.hit(); if (ring === 10) sfx.bull();
  S.result = { hit: true };
  setState('result');
}

function onMiss() {
  const b = S.bullet, T = S.target;
  S.streak = 0;
  if (b.crossed) { const [h, v] = offText(b.dx, b.dy); S.feedback = L().missAt(h, v); }
  else S.feedback = L().short(Math.max(0, T.z - b.z).toFixed(0));
  S.result = { hit: false };
  setState('result');
}

/* ───────────── 진행 ───────────── */
function setState(s) { S.state = s; S.stateT = 0; }
const bannerEl = document.getElementById('banner'); let bannerT = 0;
function banner(t, p, d) { bannerEl.querySelector('h2').textContent = t; bannerEl.querySelector('p').textContent = p; bannerEl.style.opacity = 1; bannerT = d; }
function windLabel() {
  const w = S.wind; if (Math.abs(w) < 0.05) return L().windNone;
  return L().windTxt(w > 0 ? 1 : -1, Math.abs(w).toFixed(1));
}
function startStage() {
  makeStage(S.stage);
  S.yaw = 0; S.pitch = 0; S.bullet = null; S.trail = []; S.rings = [];
  setState('aim');
  banner(`STAGE ${S.stage}`, L().introInfo(S.target.z.toFixed(0), windLabel()) + (S.target.amp ? ' · ' + L().moving : ''), 2.4);
  sfx.stage();
}
function startGame() {
  audio();
  S.stage = 1; S.score = 0; S.streak = 0; S.time = 0; S.particles = []; S.breath = 1; S.winded = false;
  overlay.classList.add('hidden');
  startStage();
}
function afterResult() {
  if (S.result.hit) { S.stage++; startStage(); }
  else if (S.ammo > 0) { S.bullet = null; setState('aim'); }
  else gameOver();
}
function gameOver() {
  setState('gameover'); sfx.over();
  if (document.pointerLockElement) document.exitPointerLock();
  const isBest = S.score > best;
  if (isBest) { best = S.score; store.set('bullet.fps.best', String(best)); }
  showCard(`<h1>${L().goTitle}</h1><p class="sub">${L().goSub}</p>
    <div class="big">${S.score.toLocaleString()}</div>
    <p class="sub">${L().goStats(S.stage, best.toLocaleString(), isBest)}</p>
    <div class="btns"><button id="go">${L().retry}</button><a class="btn ghost" href="index.html">${L().back}</a></div>
    <p class="note">${L().note}</p>`);
}

/* ───────────── 입력 ───────────── */
const AIM_LIM = { yaw: 40 * DEG, pitchMin: -10 * DEG, pitchMax: 25 * DEG };
function nudge(dyaw, dpitch) {
  S.yaw = clamp(S.yaw + dyaw, -AIM_LIM.yaw, AIM_LIM.yaw);
  S.pitch = clamp(S.pitch + dpitch, AIM_LIM.pitchMin, AIM_LIM.pitchMax);
}
const canLock = 'requestPointerLock' in cv && !touchUI;
let lockFailed = false, drag = null;
const locked = () => document.pointerLockElement === cv;
document.addEventListener('pointerlockerror', () => { lockFailed = true; });
cv.addEventListener('pointerdown', e => {
  audio();
  if (S.state === 'result' && S.stateT > 0.6) { afterResult(); return; }
  if (S.state !== 'aim') return;
  if (e.pointerType === 'mouse' && canLock && !lockFailed && !locked()) {
    try { const p = cv.requestPointerLock(); if (p && p.catch) p.catch(() => { lockFailed = true; }); } catch (err) { lockFailed = true; }
    return;
  }
  if (e.pointerType === 'mouse' && locked()) { fire(); return; }
  drag = { id: e.pointerId, x: e.clientX, y: e.clientY, moved: 0, mouse: e.pointerType === 'mouse' };
  try { cv.setPointerCapture(e.pointerId); } catch (err) {}
});
cv.addEventListener('pointermove', e => {
  if (locked() && e.pointerType === 'mouse') { if (S.state === 'aim') nudge(e.movementX * 0.025 * DEG, -e.movementY * 0.025 * DEG); return; }
  if (!drag || drag.id !== e.pointerId) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y; drag.x = e.clientX; drag.y = e.clientY; drag.moved += Math.abs(dx) + Math.abs(dy);
  const k = (drag.mouse ? 0.03 : 0.05) * DEG;
  if (S.state === 'aim') nudge(dx * k, -dy * k);
});
cv.addEventListener('pointerup', e => {
  if (!drag || drag.id !== e.pointerId) return;
  if (drag.mouse && drag.moved < 4) fire(); // 잠금이 안 되는 환경: 드래그 없이 클릭하면 발사
  drag = null;
});
addEventListener('keydown', e => {
  const k = e.key;
  if (k === 'm' || k === 'M') { toggleMute(); return; }
  if (k === 'Shift') S.holding = true;
  if (S.state === 'result' && (k === ' ' || k === 'Enter') && S.stateT > 0.6) { e.preventDefault(); afterResult(); return; }
  if ((S.state === 'title') && (k === 'Enter')) { startGame(); return; }
  if (S.state !== 'aim') return;
  const st = (e.altKey ? 0.2 : 0.02) * DEG;
  if (k === 'ArrowLeft') { nudge(-st, 0); e.preventDefault(); }
  if (k === 'ArrowRight') { nudge(st, 0); e.preventDefault(); }
  if (k === 'ArrowUp') { nudge(0, st); e.preventDefault(); }
  if (k === 'ArrowDown') { nudge(0, -st); e.preventDefault(); }
  if (k === ' ' || k === 'Enter') { e.preventDefault(); fire(); }
});
addEventListener('keyup', e => { if (e.key === 'Shift') S.holding = false; });
addEventListener('blur', () => { S.holding = false; });

const fireBtn = document.getElementById('fire'), holdBtn = document.getElementById('hold');
fireBtn.addEventListener('pointerdown', e => { e.stopPropagation(); e.preventDefault(); fire(); });
holdBtn.addEventListener('pointerdown', e => { e.stopPropagation(); e.preventDefault(); S.holding = true; });
['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => holdBtn.addEventListener(ev, () => { S.holding = false; }));
const muteBtn = document.getElementById('mute');
function toggleMute() { muted = !muted; muteBtn.textContent = muted ? '🔇' : '🔊'; }
muteBtn.addEventListener('click', e => { e.stopPropagation(); toggleMute(); });
muteBtn.addEventListener('pointerdown', e => e.stopPropagation());

const overlay = document.getElementById('overlay'), card = document.getElementById('card');
function showCard(html) {
  card.innerHTML = html; overlay.classList.remove('hidden');
  const go = card.querySelector('#go'); if (go) go.addEventListener('click', startGame);
}
function showTitle() {
  showCard(`<button class="lang ghost" id="lang">${L().langToggle}</button>
    <h1>BULLET</h1><div class="tag">${L().tag}</div>
    <p class="sub">${L().sub}</p>
    <ul>${L().rules.map(r => `<li>${r}</li>`).join('')}</ul>
    ${best ? `<p class="sub">Best ${best.toLocaleString()}</p>` : ''}
    <div class="btns"><button id="go">${L().start}</button><a class="btn ghost" href="index.html">${L().back}</a></div>
    <p class="note">${L().note}</p>`);
  card.querySelector('#lang').addEventListener('click', () => {
    LANG = LANG === 'ko' ? 'en' : 'ko'; store.set('bullet.lang', LANG); document.documentElement.lang = LANG; showTitle(); applyStaticText();
  });
}
function applyStaticText() {
  holdBtn.textContent = L().hold; fireBtn.textContent = L().fire;
  holdBtn.hidden = fireBtn.hidden = !touchUI;
}

/* ───────────── 업데이트 ───────────── */
function update(rdt) {
  S.stateT += rdt;
  // 숨: 참는 동안 줄고, 다 쓰면 한동안 크게 흔들립니다.
  if (S.holding && !S.winded && S.state === 'aim') { S.breath -= rdt / 4; if (S.breath <= 0) { S.breath = 0; S.winded = true; } }
  else { S.breath = Math.min(1, S.breath + rdt / 3); if (S.winded && S.breath > 0.5) S.winded = false; }
  swayA = damp(swayA, swayAmp(), 6, rdt);

  let tsGoal = 1;
  if (S.state === 'flight') {
    const b = S.bullet, T = S.target, prog = b.z / T.z;
    tsGoal = S.tsBase * (b.near && prog > 0.75 && prog < 1.05 ? 0.45 : 1);
    if (b.near && prog > 0.7 && !b.whoosh) { b.whoosh = true; sfx.whoosh(); }
  } else if (S.state === 'result' && S.result.hit) tsGoal = S.stateT < 0.6 ? 0.05 : 0.6;
  S.ts = S.state === 'flight' && S.stateT < 0.02 ? tsGoal : damp(S.ts, tsGoal, 8, rdt);
  const dt = rdt * S.ts;
  if (S.target) S.time += dt;

  if (S.state === 'fired' && S.stateT > 0.12) { setState('flight'); S.ts = S.tsBase; }
  if (S.state === 'flight') {
    S.physAcc += dt;
    while (S.physAcc >= PHYS_DT && S.state === 'flight') { S.physAcc -= PHYS_DT; physStep(); }
  }
  if (S.state === 'result' && S.bullet && S.bullet.stuck) { const tp = targetPos(); S.bullet.x = tp.x + S.bullet.dx; S.bullet.y = tp.y + S.bullet.dy; }
  if (S.state === 'result' && S.stateT > (S.result.hit ? 2.6 : 1.6)) afterResult();

  for (const p of S.particles) { p.vy -= G * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.z += p.vz * dt; p.life -= dt;
    if (p.y < 0.02) { p.y = 0.02; p.vy *= -0.3; p.vx *= 0.6; p.vz *= 0.6; } }
  S.particles = S.particles.filter(p => p.life > 0);
  for (const r of S.rings) r.age += dt; S.rings = S.rings.filter(r => r.age < 0.5);
  if (S.popup) { S.popup.age += rdt; if (S.popup.age > 2.4) S.popup = null; }
  S.flash = Math.max(0, S.flash - rdt); S.shake = Math.max(0, S.shake - rdt * 2.5);
  if (bannerT > 0) { bannerT -= rdt; if (bannerT <= 0) bannerEl.style.opacity = 0; }
}

/* ───────────── 3D 투영 ───────────── */
let C = { x: 0, y: EYE, z: 0, yaw: 0, pitch: 0, cy: 1, sy: 0, cp: 1, sp: 0 };
function setCam(x, y, z, yaw, pitch) {
  C = { x, y, z, yaw, pitch, cy: Math.cos(yaw), sy: Math.sin(yaw), cp: Math.cos(pitch), sp: Math.sin(pitch) };
}
function proj(x, y, z) {
  const dx = x - C.x, dy = y - C.y, dz = z - C.z;
  const x1 = dx * C.cy - dz * C.sy, z1 = dx * C.sy + dz * C.cy;
  const y2 = dy * C.cp - z1 * C.sp, z2 = dy * C.sp + z1 * C.cp;
  if (z2 < 0.05) return null;
  return { x: W / 2 + F * x1 / z2, y: H / 2 - F * y2 / z2, d: z2, s: F / z2 };
}
function cameraFor() {
  const T = S.target;
  if (S.state === 'flight' && S.bullet) {
    const b = S.bullet, sp = Math.hypot(b.vx, b.vy, b.vz), d = { x: b.vx / sp, y: b.vy / sp, z: b.vz / sp };
    const yaw = Math.atan2(d.x, d.z), pitch = Math.asin(d.y);
    const right = { x: Math.cos(yaw), z: -Math.sin(yaw) };
    setCam(b.x - d.x * 2.2 + right.x * 0.12, b.y - d.y * 2.2 + 0.1, b.z - d.z * 2.2 + right.z * 0.12, yaw, pitch);
    return;
  }
  if (S.state === 'result' && S.result.hit) {
    const tp = targetPos(), cx = tp.x - T.R * 1.6, cyy = tp.y + T.R * 0.4, cz = T.z - T.R * 7;
    setCam(cx, cyy, cz, Math.atan2(tp.x - cx, T.z - cz), Math.atan2(tp.y - cyy, Math.hypot(tp.x - cx, T.z - cz)));
    return;
  }
  const a = aimDir(), kick = S.state === 'fired' ? (0.12 - S.stateT) / 0.12 * 1.2 * DEG : 0;
  setCam(0, EYE, 0, a.yaw, a.pitch + Math.max(0, kick));
}

/* ───────────── 그리기 ───────────── */
function windPose(phase) {
  const lift = clamp(Math.abs(S.wind) / 8, 0, 1), dir = S.wind >= 0 ? 1 : -1;
  const f = Math.sin(performance.now() / (90 + 60 * (1 - lift)) + phase) * (0.04 + 0.08 * lift);
  return { dx: dir * lift, dy: -(1 - lift) * 0.95 + f, flutter: f };
}
function drawSky() {
  const hz = H / 2 + F * Math.tan(C.pitch);
  const g = ctx.createLinearGradient(0, hz - H * 1.1, 0, hz);
  g.addColorStop(0, '#1f3f7a'); g.addColorStop(0.6, '#e99a63'); g.addColorStop(1, '#ffd8a0');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // 태양
  const sun = proj(C.x + Math.sin(0.5) * 1000, C.y + 70, C.z + Math.cos(0.5) * 1000);
  if (sun) { const sg = ctx.createRadialGradient(sun.x, sun.y, 0, sun.x, sun.y, 180);
    sg.addColorStop(0, 'rgba(255,245,210,.95)'); sg.addColorStop(0.15, 'rgba(255,220,150,.7)'); sg.addColorStop(1, 'rgba(255,200,120,0)');
    ctx.fillStyle = sg; ctx.fillRect(sun.x - 180, sun.y - 180, 360, 360); }
  // 산 (지평선 위 실루엣)
  for (const [col, amp, seed] of [['rgba(120,96,140,.8)', 3.2, 1.3], ['rgba(84,72,104,.95)', 1.8, 4.1]]) {
    ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(0, H);
    for (let x = 0; x <= W + 8; x += 8) {
      const ang = C.yaw + Math.atan((x - W / 2) / F);
      const e = amp * DEG * (0.55 + 0.25 * Math.sin(ang * 9 + seed) + 0.14 * Math.sin(ang * 23 + seed * 2) + 0.06 * Math.sin(ang * 57));
      ctx.lineTo(x, hz - F * Math.tan(e + C.pitch) + F * Math.tan(C.pitch));
    }
    ctx.lineTo(W, H); ctx.closePath(); ctx.fill();
  }
  return hz;
}
function drawGround(hz) {
  if (hz < H) {
    const g = ctx.createLinearGradient(0, hz, 0, H); g.addColorStop(0, '#7aa34a'); g.addColorStop(1, '#3d5d27');
    ctx.fillStyle = g; ctx.fillRect(0, Math.max(0, hz), W, H - Math.max(0, hz));
  }
  // 사로 경계선과 10m 간격 선
  ctx.strokeStyle = 'rgba(255,255,255,.12)'; ctx.lineWidth = 1; ctx.beginPath();
  for (let z = 10; z <= 200; z += 10) {
    const a = proj(-30, 0, z), b = proj(30, 0, z);
    if (a && b) { ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); }
  }
  for (const x of [-6, 6]) {
    let prev = null;
    for (let z = Math.max(1, C.z + 0.5); z <= 220; z += z < 20 ? 1 : 5) { const p = proj(x, 0, z); if (p && prev) { ctx.moveTo(prev.x, prev.y); ctx.lineTo(p.x, p.y); } prev = p; }
  }
  ctx.stroke();
}
function drawTree(t) {
  const b = proj(t.x, 0, t.z), top = proj(t.x, t.h, t.z); if (!b || !top) return;
  const w = t.w * b.s, h = b.y - top.y;
  ctx.fillStyle = '#4a3423'; ctx.fillRect(b.x - 0.12 * b.s, b.y - h * 0.45, 0.24 * b.s, h * 0.45);
  ctx.fillStyle = t.shade < 0.5 ? '#2f5a35' : '#3b6b3b';
  for (let i = 0; i < 3; i++) {
    const cy = b.y - h * (0.42 + i * 0.18), ww = w * (1 - i * 0.25);
    ctx.beginPath(); ctx.moveTo(b.x - ww, cy); ctx.lineTo(b.x, cy - h * 0.36); ctx.lineTo(b.x + ww, cy); ctx.closePath(); ctx.fill();
  }
}
function drawFlag(f) {
  const base = proj(f.x, 0, f.z), top = proj(f.x, f.h, f.z); if (!base || !top) return;
  ctx.strokeStyle = '#ddd'; ctx.lineWidth = Math.max(1, 0.06 * base.s);
  ctx.beginPath(); ctx.moveTo(base.x, base.y); ctx.lineTo(top.x, top.y); ctx.stroke();
  const pose = windPose(f.phase), len = 1.2;
  const tip = proj(f.x + pose.dx * len, f.h + pose.dy * len * 0.6 - 0.15, f.z), low = proj(f.x, f.h - 0.4, f.z);
  if (tip && low) {
    ctx.fillStyle = f.near ? '#ffd23f' : '#ff6a2b';
    ctx.beginPath(); ctx.moveTo(top.x, top.y); ctx.lineTo(tip.x, tip.y); ctx.lineTo(low.x, low.y); ctx.closePath(); ctx.fill();
  }
  if (f.label && base.s > 6) {
    ctx.fillStyle = 'rgba(20,20,20,.7)'; const sw = 1.1 * base.s, sh = 0.5 * base.s, sy = base.y - 1.3 * base.s;
    ctx.fillRect(base.x - sw / 2, sy, sw, sh);
    ctx.fillStyle = '#fff'; ctx.font = `600 ${clamp(0.38 * base.s, 8, 18)}px system-ui, sans-serif`; ctx.textAlign = 'center';
    ctx.fillText(`${f.label}m`, base.x, sy + sh * 0.75);
  }
}
function drawTarget() {
  const T = S.target, tp = targetPos(), c = proj(tp.x, tp.y, T.z); if (!c) return;
  const r = T.R * c.s;
  // 받침대 / 레일
  ctx.strokeStyle = '#6b4a2b'; ctx.lineWidth = Math.max(1.5, 0.1 * c.s);
  const gl = proj(tp.x - 0.6, 0, T.z), gr = proj(tp.x + 0.6, 0, T.z), bot = proj(tp.x, tp.y - T.R, T.z);
  if (T.amp > 0) {
    const l = proj(T.x - T.amp - T.R - 0.3, tp.y - T.R - 0.1, T.z), rr = proj(T.x + T.amp + T.R + 0.3, tp.y - T.R - 0.1, T.z);
    const l0 = proj(T.x - T.amp - T.R - 0.3, 0, T.z), r0 = proj(T.x + T.amp + T.R + 0.3, 0, T.z);
    ctx.strokeStyle = '#5a6470';
    if (l && rr && l0 && r0) { ctx.beginPath(); ctx.moveTo(l.x, l.y); ctx.lineTo(rr.x, rr.y); ctx.moveTo(l.x, l.y); ctx.lineTo(l0.x, l0.y); ctx.moveTo(rr.x, rr.y); ctx.lineTo(r0.x, r0.y); ctx.stroke(); }
  } else if (gl && gr && bot) {
    ctx.beginPath(); ctx.moveTo(gl.x, gl.y); ctx.lineTo(bot.x, bot.y); ctx.lineTo(gr.x, gr.y); ctx.stroke();
  }
  ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.beginPath(); ctx.arc(c.x + r * 0.06, c.y + r * 0.06, r * 1.03, 0, Math.PI * 2); ctx.fill();
  const cols = ['#f4f1ea', '#f4f1ea', '#262626', '#262626', '#1d6fd1', '#1d6fd1', '#e63946', '#e63946', '#ffd23f', '#ffd23f'];
  for (let i = 10; i >= 1; i--) {
    ctx.fillStyle = cols[10 - i]; ctx.beginPath(); ctx.arc(c.x, c.y, Math.max(0.6, r * i / 10), 0, Math.PI * 2); ctx.fill();
    if (r > 30) { ctx.strokeStyle = 'rgba(0,0,0,.25)'; ctx.lineWidth = 1; ctx.stroke(); }
  }
  ctx.strokeStyle = '#3b2a1a'; ctx.lineWidth = Math.max(1, 0.05 * c.s); ctx.beginPath(); ctx.arc(c.x, c.y, r, 0, Math.PI * 2); ctx.stroke();
  for (const m of S.marks) {
    const p = proj(tp.x + m.dx, tp.y + m.dy, T.z - 0.01); if (!p) continue;
    const mr = Math.max(1.2, 0.04 * p.s);
    ctx.fillStyle = 'rgba(255,255,255,.5)'; ctx.beginPath(); ctx.arc(p.x, p.y, mr * 1.7, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(p.x, p.y, mr, 0, Math.PI * 2); ctx.fill();
  }
}
function drawBullet() {
  const b = S.bullet; if (!b || b.stuck) return;
  for (let i = 1; i < S.trail.length; i++) {
    const p0 = proj(S.trail[i - 1].x, S.trail[i - 1].y, S.trail[i - 1].z), p1 = proj(S.trail[i].x, S.trail[i].y, S.trail[i].z);
    if (!p0 || !p1) continue; const a = i / S.trail.length;
    ctx.strokeStyle = `rgba(255,${Math.round(200 + 55 * a)},${Math.round(150 + 80 * a)},${a * 0.8})`;
    ctx.lineWidth = clamp(0.03 * p1.s * a, 1, 5); ctx.beginPath(); ctx.moveTo(p0.x, p0.y); ctx.lineTo(p1.x, p1.y); ctx.stroke();
  }
  for (const r of S.rings) {
    const p = proj(r.x, r.y, r.z); if (!p) continue; const t = r.age / 0.5;
    ctx.strokeStyle = `rgba(255,255,255,${0.5 * (1 - t)})`; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(p.x, p.y, (0.1 + t * 0.9) * p.s, 0, Math.PI * 2); ctx.stroke();
  }
  const sp = Math.hypot(b.vx, b.vy, b.vz), head = proj(b.x, b.y, b.z), tail = proj(b.x - b.vx / sp * 0.08, b.y - b.vy / sp * 0.08, b.z - b.vz / sp * 0.08);
  if (!head) return;
  const rad = Math.max(2.5, 0.025 * head.s);
  const g = ctx.createRadialGradient(head.x, head.y, 0, head.x, head.y, rad * 5);
  g.addColorStop(0, 'rgba(255,230,160,.8)'); g.addColorStop(1, 'rgba(255,200,120,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(head.x, head.y, rad * 5, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#d49a3a'; ctx.beginPath(); ctx.arc(head.x, head.y, rad, 0, Math.PI * 2); ctx.fill();
  if (tail) { ctx.strokeStyle = '#8a5a1c'; ctx.lineWidth = rad * 1.4; ctx.beginPath(); ctx.moveTo(tail.x, tail.y); ctx.lineTo(head.x, head.y); ctx.stroke(); }
}
function drawParticles() {
  for (const p of S.particles) {
    const q = proj(p.x, p.y, p.z); if (!q) continue;
    ctx.fillStyle = `rgba(${p.color},${clamp(p.life / p.max, 0, 1)})`; const s = Math.max(1.2, p.size * q.s);
    ctx.fillRect(q.x - s / 2, q.y - s / 2, s, s);
  }
}
// 가늠자(뒤 고리)와 가늠쇠(앞 기둥): 기둥 끝이 정확히 화면 가운데 = 조준점
function drawIronSights() {
  const cx = W / 2, cy = H / 2, u = Math.min(W, H) / 100;
  ctx.save();
  if (S.shake > 0) ctx.translate(rand(-1, 1) * S.shake * 6, rand(-1, 1) * S.shake * 6);
  // 총몸 실루엣
  ctx.fillStyle = '#16181c';
  ctx.beginPath(); ctx.moveTo(cx - 34 * u, H); ctx.lineTo(cx - 9 * u, cy + 18 * u); ctx.lineTo(cx + 9 * u, cy + 18 * u); ctx.lineTo(cx + 34 * u, H); ctx.closePath(); ctx.fill();
  // 뒤 가늠자 고리 (흐릿하게 크게)
  ctx.strokeStyle = 'rgba(20,22,26,.92)'; ctx.lineWidth = 7 * u;
  ctx.beginPath(); ctx.arc(cx, cy, 13 * u, 0, Math.PI * 2); ctx.stroke();
  ctx.fillStyle = 'rgba(20,22,26,.92)'; ctx.fillRect(cx - 5 * u, cy + 16 * u, 10 * u, H);
  // 앞 가늠쇠: 보호 날개 + 기둥
  ctx.fillStyle = '#0d0e10';
  ctx.fillRect(cx - 0.45 * u, cy, 0.9 * u, 18 * u);
  ctx.beginPath(); ctx.moveTo(cx - 5.5 * u, cy + 18 * u); ctx.lineTo(cx - 4.2 * u, cy + 1.5 * u); ctx.lineTo(cx - 3.2 * u, cy + 1.5 * u); ctx.lineTo(cx - 3.6 * u, cy + 18 * u); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(cx + 5.5 * u, cy + 18 * u); ctx.lineTo(cx + 4.2 * u, cy + 1.5 * u); ctx.lineTo(cx + 3.2 * u, cy + 1.5 * u); ctx.lineTo(cx + 3.6 * u, cy + 18 * u); ctx.closePath(); ctx.fill();
  ctx.fillRect(cx - 5.5 * u, cy + 16 * u, 11 * u, 3 * u);
  // 고리 바깥은 살짝 어둡게
  const vg = ctx.createRadialGradient(cx, cy, 18 * u, cx, cy, Math.max(W, H) * 0.7);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,.45)');
  ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
  // 총구 화염
  if (S.flash > 0) {
    ctx.fillStyle = `rgba(255,236,170,${S.flash * 9})`;
    ctx.beginPath(); ctx.arc(cx, cy - 1 * u, 9 * u, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = `rgba(255,250,230,${S.flash * 4})`; ctx.fillRect(0, 0, W, H);
  }
  ctx.restore();
}
function drawPopup() {
  const p = S.popup; if (!p) return;
  const a = p.age < 0.15 ? p.age / 0.15 : p.age > 1.9 ? Math.max(0, (2.4 - p.age) / 0.5) : 1;
  ctx.globalAlpha = a; ctx.textAlign = 'center';
  ctx.font = `800 ${Math.round(clamp(W / 16, 28, 56))}px system-ui, sans-serif`;
  ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(0,0,0,.6)'; ctx.strokeText(p.title, W / 2, H * 0.2); ctx.fillStyle = p.gold ? '#ffd23f' : '#fff'; ctx.fillText(p.title, W / 2, H * 0.2);
  ctx.font = `700 ${Math.round(clamp(W / 40, 14, 22))}px system-ui, sans-serif`;
  ctx.lineWidth = 4; ctx.strokeText(p.sub, W / 2, H * 0.2 + 34); ctx.fillStyle = '#ffe8a8'; ctx.fillText(p.sub, W / 2, H * 0.2 + 34);
  ctx.globalAlpha = 1;
}
function render() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  if (!S.target) { ctx.fillStyle = '#0b1622'; ctx.fillRect(0, 0, W, H); return; }
  cameraFor();
  const hz = drawSky(); drawGround(hz);
  const items = [];
  for (const t of S.trees) items.push({ z: t.z - C.z, f: () => drawTree(t) });
  for (const f of S.flags) items.push({ z: f.z - C.z + 0.01, f: () => drawFlag(f) });
  items.push({ z: S.target.z - C.z, f: drawTarget });
  items.sort((a, b) => b.z - a.z);
  for (const it of items) it.f();
  drawParticles(); drawBullet();
  const fpv = S.state === 'aim' || S.state === 'fired' || (S.state === 'result' && !S.result.hit);
  if (fpv) drawIronSights();
  else {
    const slow = clamp(1 - S.ts / Math.max(0.05, S.tsBase) * 0.6, 0, 1), bar = H * 0.07;
    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, bar); ctx.fillRect(0, H - bar, W, bar);
    if (slow > 0) { const vg = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.3, W / 2, H / 2, Math.max(W, H) * 0.75);
      vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, `rgba(10,5,0,${0.5 * slow})`); ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H); }
  }
  drawPopup();
}

/* ───────────── HUD ───────────── */
const infoEl = document.getElementById('info'), hintEl = document.getElementById('hint');
const breathEl = document.getElementById('breath'), breathBar = document.getElementById('breathBar'), breathLabel = document.getElementById('breathLabel');
let lastInfo = '';
function updateHud() {
  const playing = S.state !== 'title' && S.state !== 'gameover' && S.target;
  infoEl.hidden = breathEl.hidden = !playing;
  fireBtn.style.visibility = holdBtn.style.visibility = playing && S.state === 'aim' ? 'visible' : 'hidden';
  if (!playing) { hintEl.hidden = true; return; }
  const T = S.target, w = S.wind, aw = Math.abs(w), lv = aw < 2 ? 0 : aw < 4 ? 1 : aw < 6 ? 2 : 3, bars = Math.min(5, Math.ceil(aw / 1.6));
  const ammo = Array.from({ length: 3 }, (_, i) => `<span class="${i < S.ammo ? '' : 'used'}"></span>`).join('');
  const html =
    `<div class="row"><span>${L().stage}</span><b>${S.stage}</b></div>` +
    `<div class="row"><span>${L().score}</span><b>${S.score.toLocaleString()}</b></div>` +
    `<div class="row"><span>${L().ammo}</span><span id="ammo">${ammo}</span></div><div class="sep"></div>` +
    `<div class="row"><span>${L().dist}</span><span>${T.z.toFixed(0)} m</span></div>` +
    `<div class="row"><span>${L().wind}</span><span>${windLabel()}</span></div>` +
    (aw >= 0.05 ? `<div class="row"><span></span><span class="bars">${'<b class="on"></b>'.repeat(bars)}${'<b></b>'.repeat(5 - bars)} ${L().windLv[lv]}</span></div>` : '') +
    (T.amp ? `<div class="row"><span></span><span>${L().moving}</span></div>` : '') +
    (S.feedback ? `<div class="sep"></div><div class="fb">${S.feedback}</div>` : '');
  if (html !== lastInfo) { infoEl.innerHTML = html; lastInfo = html; }
  const needLock = S.state === 'aim' && !touchUI && canLock && !lockFailed && !locked();
  hintEl.hidden = !needLock; if (needLock) hintEl.textContent = L().lockHint;
  breathLabel.textContent = S.winded ? L().breathOut : S.holding ? L().breathHold : L().breath;
  breathBar.style.width = Math.round(S.breath * 100) + '%';
  breathBar.style.background = S.winded ? '#ff8a8a' : '#9fe9ff';
}

/* ───────────── 루프 ───────────── */
let last = performance.now();
function frame(now) {
  const rdt = Math.min(0.05, (now - last) / 1000); last = now;
  update(rdt); render(); updateHud();
  requestAnimationFrame(frame);
}
S.debug = { predict, targetPos }; // 테스트용
makeStage(1);
applyStaticText();
showTitle();
requestAnimationFrame(frame);
})();
</script>
